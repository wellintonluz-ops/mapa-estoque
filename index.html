<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRP - Módulo de Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for better aesthetics */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        /* Style for the grid cells */
        .pallet-cell {
            transition: all 0.2s ease-in-out;
        }
        .pallet-cell:hover {
            background-color: #4b5563; /* gray-600 */
            z-index: 10;
        }
        .pallet-cell.selected {
            background-color: #fbbf24;
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
            transform: scale(1.05);
            z-index: 20;
        }
        .pallet-cell.filled {
            background-color: #2563eb; /* blue-600 */
        }
        .pallet-cell.filled:hover {
            background-color: #1d4ed8; /* blue-700 */
        }
        .pallet-cell.partial-fill {
            background-color: #ef4444; /* red-500 */
        }
        .pallet-cell.partial-fill:hover {
            background-color: #dc2626; /* red-600 */
        }
        .pallet-cell.over-capacity {
            background-color: #f97316; /* orange-500 */
        }
        .pallet-cell.over-capacity:hover {
            background-color: #ea580c; /* orange-600 */
        }
        .menu-text {
            transition: opacity 0.2s ease-in-out, width 0.2s ease-in-out;
        }
        /* Active menu item styles */
        .active-menu-item {
            background-color: #374151; /* gray-700 */
        }
        a[data-rack="dashboard"].active-menu-item { background-color: #ca8a04; } /* yellow-600 */
        a[data-rack="import"].active-menu-item { background-color: #0F766E; } /* teal-700 */
        a[data-rack="params"].active-menu-item { background-color: #7E22CE; } /* purple-700 */
        a[data-rack="forecast"].active-menu-item { background-color: #059669; } /* green-600 */
        a[data-rack="programming"].active-menu-item { background-color: #BE185D; } /* pink-700 */
        a[data-rack="instructions"].active-menu-item { background-color: #4338CA; } /* indigo-700 */
        a[data-rack="all"].active-menu-item { background-color: #B45309; } /* amber-700 */
        a[data-rack="organization"].active-menu-item { background-color: #0369a1; } /* sky-700 */

        .uppercase-input {
            text-transform: uppercase;
        }
        .uppercase-input::placeholder {
            text-transform: none;
        }
        .pallet-cell.search-highlight {
            background-color: #10b981 !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
            z-index: 15;
        }
        .pallet-cell.search-highlight:hover {
            background-color: #059669 !important;
        }
        .pallet-cell.search-dimmed {
            opacity: 0.12 !important;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="bg-gray-800 shadow-lg p-4 z-30">
            <h1 class="text-2xl font-bold text-center text-amber-400">MRP - Módulo de Estoque</h1>
            <div id="global-stats-panel" class="text-center text-gray-300 mt-2 text-sm"></div>
            <p id="details-panel" class="text-center text-gray-300 mt-1 h-6">Carregando dados...</p>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar with Rack Selector -->
            <nav id="sidebar" class="group w-16 hover:w-64 bg-gray-800 p-2 overflow-y-auto custom-scrollbar transition-all duration-300 ease-in-out">
                <ul id="rack-selector" class="space-y-2 mt-4">
                    <!-- Links will be generated here -->
                </ul>
            </nav>

            <!-- Rack Display Area -->
            <main id="main-content" class="flex-1 p-4 md:p-6 lg:p-8 overflow-auto custom-scrollbar">
                <!-- Content will be generated here -->
            </main>
        </div>
    </div>
    
    <!-- Firebase SDKs - Updated to v11.6.1 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', () => {
            const rackSelector = document.getElementById('rack-selector');
            const mainContent = document.getElementById('main-content');
            const detailsPanel = document.getElementById('details-panel');
            const globalStatsPanel = document.getElementById('global-stats-panel');
            
            // --- FIREBASE SETUP ---
            const firebaseConfigFromEnv = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            
            // Restoring the original credentials provided by the user.
            const firebaseConfig = firebaseConfigFromEnv || {
                apiKey: "AIzaSyDi9i59ySZSaBnniQUwBKcKlst2PA8AgTc",
                authDomain: "mapa-estoque.firebaseapp.com",
                projectId: "mapa-estoque",
                storageBucket: "mapa-estoque.appspot.com",
                messagingSenderId: "877978797929",
                appId: "1:877978797929:web:3a6c7c006a32fe5d0b5ff8",
                measurementId: "G-4GNC5SKF17"
            };
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);

            // Projeto exclusivo de capacidade de ocupação por pallet (coleção pallet_padrao: code + qty)
            const palletCapacityConfig = {
                apiKey: "AIzaSyCPCOAyn-SuhpDdTyFY4sZQ0Iv7GCQrLVM",
                authDomain: "ocupacao-de-pallet.firebaseapp.com",
                projectId: "ocupacao-de-pallet",
                storageBucket: "ocupacao-de-pallet.firebasestorage.app",
                messagingSenderId: "259468491054",
                appId: "1:259468491054:web:4945dd23626b465874a2bf",
                measurementId: "G-N1DT3R3LS0"
            };
            const palletApp = initializeApp(palletCapacityConfig, "ocupacao-de-pallet");
            const palletDb = getFirestore(palletApp);
            const palletAuth = getAuth(palletApp);

            let userId = null;
            let palletListenerSetup = false;
            let isInitialLoad = true;
            let activeRackId = 'dashboard'; // Start with the new dashboard
            let nextRenderMessage = null;
            // --- END FIREBASE SETUP ---

            const DEFAULT_INSTRUCTIONS = [
                { title: 'PORTA PALLETS 01 AO 10', content: 'AQUI VAI A INSTRUÇÃO PARA OS PORTA-PALLETS DE 1 A 10. EX: ARMAZENAR PRODUTOS DA CATEGORIA A, ALTA ROTATIVIDADE, ELETRÔNICOS.' },
                { title: 'PORTA PALLETS 11 AO 26', content: 'INSTRUÇÃO PARA OS PORTA-PALLETS DE 11 A 26. EX: ARMAZENAR PRODUTOS DA CATEGORIA B, MÉDIA ROTATIVIDADE, ELETRODOMÉSTICOS.' },
                { title: 'REGRA GERAL', content: 'QUALQUER OUTRA REGRA GERAL OU LEGENDA PODE SER ADICIONADA AQUI.' }
            ];

            let INSTRUCTIONS_DATA = [];
            let inventoryState = {};
            let PRODUCT_PARAMS_DATA = [];
            let PROGRAMMING_DATA = [];
            let FORECAST_DATA = {};
            
            const WAREHOUSE_CONFIG = {
                totalRacks: 26,
                levelLetters: ['F', 'E', 'D', 'C', 'B', 'A'],
                levelMap: { 'F': '06', 'E': '05', 'D': '04', 'C': '03', 'B': '02', 'A': '01' },
                sides: ['A', 'B'],
                getColsForRack: (rackNumber) => {
                    if (rackNumber >= 1 && rackNumber <= 10) return 21;
                    if (rackNumber >= 11 && rackNumber <= 26) return 16;
                    return 0;
                }
            };
            
            let selectedCell = null;
            let graficoOcupacaoHist = null;
            let currentDashboardStats = null;
            let todosOsDadosHist = [];
            let modoVistaHist = 'diario';
            let filtroHistInicioAtivo = null;
            let filtroHistFimAtivo = null;

            function updateGlobalStats(sourceInventory = inventoryState) {
                let grandTotalPositions = 0;
                for (let i = 1; i <= WAREHOUSE_CONFIG.totalRacks; i++) {
                    const cols = WAREHOUSE_CONFIG.getColsForRack(i);
                    grandTotalPositions += cols * WAREHOUSE_CONFIG.levelLetters.length * WAREHOUSE_CONFIG.sides.length;
                }

                const totalOccupied = Object.keys(sourceInventory).length;
                const totalItems = Object.values(sourceInventory).reduce((sum, item) => {
                    const quantity = parseFloat(item.quantity);
                    return sum + (isNaN(quantity) ? 0 : quantity);
                }, 0);
                const globalPercentage = grandTotalPositions > 0 ? ((totalOccupied / grandTotalPositions) * 100).toFixed(1) : 0;

                globalStatsPanel.innerHTML = `
                    <span class="font-semibold text-white">Total de Posições: ${grandTotalPositions.toLocaleString('pt-BR')}</span> | 
                    <span class="font-semibold text-red-400">Posições Ocupadas: ${totalOccupied.toLocaleString('pt-BR')}</span> | 
                    <span class="font-bold text-amber-400">Ocupação (Posições): ${globalPercentage}%</span> |
                    <span class="font-semibold text-cyan-400">Soma Total de Itens: ${Math.round(totalItems).toLocaleString('pt-BR')}</span>
                `;
            }

            async function saveData() {
                if (!auth.currentUser) {
                    console.error("Usuário não autenticado. Não é possível salvar.");
                    return;
                }
                const publicDocRef = doc(db, "artifacts", appId, "public/data/mapData", "singleton");
                try {
                    await setDoc(publicDocRef, {
                        inventoryState: JSON.stringify(inventoryState),
                        INSTRUCTIONS_DATA,
                        PROGRAMMING_DATA,
                        FORECAST_DATA: JSON.stringify(FORECAST_DATA)
                    });
                } catch (error) {
                    console.error("Erro ao salvar dados no Firestore: ", error);
                }
            }

            function setupRealtimeListener() {
                if (!auth.currentUser) {
                    console.error("User not authenticated. Cannot set up listener.");
                    return;
                }
                const publicDocRef = doc(db, "artifacts", appId, "public/data/mapData", "singleton");
                
                onSnapshot(publicDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        INSTRUCTIONS_DATA = data.INSTRUCTIONS_DATA || DEFAULT_INSTRUCTIONS;
                        try {
                            inventoryState = data.inventoryState ? JSON.parse(data.inventoryState) : {};
                        } catch (e) {
                            console.error("Error parsing inventoryState from Firestore:", e);
                            inventoryState = {};
                        }
                        try {
                            FORECAST_DATA = data.FORECAST_DATA ? JSON.parse(data.FORECAST_DATA) : {};
                        } catch (e) {
                            console.error("Error parsing FORECAST_DATA from Firestore:", e);
                            FORECAST_DATA = {};
                        }
                        PROGRAMMING_DATA = data.PROGRAMMING_DATA || [];
                        applyParamsToInventory();
                    } else {
                        console.log("No data found, creating new public document.");
                        INSTRUCTIONS_DATA = DEFAULT_INSTRUCTIONS;
                        inventoryState = {};
                        PROGRAMMING_DATA = [];
                        FORECAST_DATA = {};
                        saveData(); // Create the initial document
                    }

                    if (isInitialLoad) {
                        isInitialLoad = false;
                        detailsPanel.textContent = 'Selecione uma posição para ver os detalhes';
                        createRackSelector();
                        const firstRackLink = rackSelector.querySelector(`a[data-rack="${activeRackId}"]`);
                        if (firstRackLink) {
                            setActiveMenuItem(firstRackLink);
                            refreshCurrentView();
                        }
                    } else {
                        refreshCurrentView();
                    }
                });
            }

            // Recalcula o percentual de ocupação de todas as posições com base nos
            // parâmetros vindos do projeto "ocupacao-de-pallet". Itens sem parâmetro ficam em 100%.
            function applyParamsToInventory() {
                Object.keys(inventoryState).forEach(address => {
                    const stockItem = inventoryState[address];
                    if (stockItem && stockItem.item !== 'OCUPADO MANUALMENTE') {
                        const productParam = PRODUCT_PARAMS_DATA.find(p => p.code.toUpperCase() === String(stockItem.item).toUpperCase());
                        if (productParam) {
                            const maxQty = parseFloat(productParam.maxQty);
                            stockItem.percentage = maxQty > 0 ? (parseFloat(stockItem.quantity) / maxQty) * 100 : 100;
                        } else {
                            stockItem.percentage = 100;
                        }
                    }
                });
            }

            // Escuta em tempo real a coleção pallet_padrao do projeto exclusivo de
            // capacidade de ocupação. Cada documento traz { code, qty } → { code, maxQty }.
            function setupPalletCapacityListener() {
                onSnapshot(collection(palletDb, "pallet_padrao"), (snapshot) => {
                    PRODUCT_PARAMS_DATA = snapshot.docs
                        .map(d => {
                            const data = d.data();
                            return { code: String(data.code || '').trim().toUpperCase(), maxQty: data.qty };
                        })
                        .filter(p => p.code && parseFloat(p.maxQty) > 0);
                    applyParamsToInventory();
                    if (!isInitialLoad) {
                        refreshCurrentView();
                    }
                }, (error) => {
                    console.error("Erro ao ler capacidades do projeto ocupacao-de-pallet:", error);
                });
            }

            function refreshCurrentView() {
                const message = nextRenderMessage;
                nextRenderMessage = null; // Consume message

                const currentRackId = activeRackId;
                switch(currentRackId) {
                    case 'dashboard': displayDashboard(); break;
                    case 'import': displayImportScreen(); break;
                    case 'instructions': displayInstructions(); break;
                    case 'params': displayProductParamsScreen(!!message, message); break;
                    case 'programming': displayProgrammingScreen(!!message, message); break;
                    case 'forecast': displayForecastScreen(!!message, message); break;
                    case 'organization': displayOrganizationTaskScreen(); break;
                    case 'all': displayAllRacks(); break;
                    default: displaySingleRack(parseInt(currentRackId, 10)); break;
                }
                updateGlobalStats();
            }

            function createRackSelector() {
                rackSelector.innerHTML = '';

                const icons = {
                    dashboard: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>`,
                    import: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>`,
                    params: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`,
                    forecast: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>`,
                    programming: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`,
                    instructions: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>`,
                    organization: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>`,
                    all: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>`,
                    rack: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>`
                };

                const createMenuItem = (rackId, text, icon, colorClasses, isRackLink = false) => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#';
                    link.dataset.rack = rackId;
                    let finalClasses = `flex items-center w-full justify-center group-hover:justify-start p-2 rounded-md font-medium transition-colors duration-200 ${colorClasses}`;
                    if (isRackLink) finalClasses += ' rack-link';
                    link.className = finalClasses;
                    
                    link.innerHTML = `
                        <div class="flex-shrink-0">${icon}</div>
                        <span class="menu-text opacity-0 w-0 group-hover:w-auto group-hover:opacity-100 whitespace-nowrap ml-3 transition-all duration-200">${text}</span>
                    `;
                    listItem.appendChild(link);
                    rackSelector.appendChild(listItem);
                };
                
                // Add new Dashboard link first
                createMenuItem('dashboard', 'Dashboard', icons.dashboard, 'bg-yellow-700 text-white hover:bg-yellow-600');
                
                const separator1 = document.createElement('hr');
                separator1.className = "border-gray-700 my-4";
                rackSelector.appendChild(separator1);

                createMenuItem('import', 'Importar Relatório', icons.import, 'bg-teal-600 text-white hover:bg-teal-500');
                createMenuItem('params', 'Parâmetros', icons.params, 'bg-purple-600 text-white hover:bg-purple-500');
                createMenuItem('forecast', 'Forecast', icons.forecast, 'bg-green-600 text-white hover:bg-green-500');
                createMenuItem('programming', 'Programação', icons.programming, 'bg-pink-600 text-white hover:bg-pink-500');
                createMenuItem('instructions', 'Instruções', icons.instructions, 'bg-indigo-600 text-white hover:bg-indigo-500');
                createMenuItem('organization', 'Tarefa de Organização', icons.organization, 'bg-sky-600 text-white hover:bg-sky-500');

                const separator2 = document.createElement('hr');
                separator2.className = "border-gray-700 my-4";
                rackSelector.appendChild(separator2);
                
                createMenuItem('all', 'Visualizar Todos', icons.all, 'bg-amber-600 text-white hover:bg-amber-500');
                
                const separator3 = document.createElement('hr');
                separator3.className = "border-gray-700 my-4";
                rackSelector.appendChild(separator3);
                
                for (let i = 1; i <= WAREHOUSE_CONFIG.totalRacks; i++) {
                     createMenuItem(i, `Porta Pallet ${String(i).padStart(2, '0')}`, icons.rack, 'text-gray-400 hover:bg-gray-700 hover:text-white', true);
                }
            }
            
            function displayOrganizationTaskScreen() {
                mainContent.innerHTML = '';

                const header = document.createElement('h2');
                header.className = 'text-2xl font-bold text-sky-400 mb-2';
                header.textContent = 'Tarefa de Organiza\u00e7\u00e3o';
                mainContent.appendChild(header);

                const subtitle = document.createElement('p');
                subtitle.className = 'text-gray-400 text-sm mb-6';
                subtitle.textContent = 'Consolida\u00e7\u00e3o de posi\u00e7\u00f5es parciais: retira das menores e aloca nas maiores at\u00e9 completar a capacidade m\u00e1xima do pallet.';
                mainContent.appendChild(subtitle);

                if (PRODUCT_PARAMS_DATA.length === 0) {
                    mainContent.innerHTML += '<p class="text-yellow-400 bg-gray-800 p-4 rounded-lg">Nenhuma capacidade recebida do projeto de <strong>Ocupa\u00e7\u00e3o de Pallet</strong> at\u00e9 o momento. Cadastre os pallets l\u00e1 ou verifique a conex\u00e3o.</p>';
                    return;
                }

                const allTasks = [];
                let totalFreedPositions = 0;
                let totalMoves = 0;

                PRODUCT_PARAMS_DATA.forEach(param => {
                    const code = param.code.toUpperCase();
                    const maxQty = parseFloat(param.maxQty);
                    if (!maxQty || maxQty <= 0) return;

                    const partialPositions = Object.entries(inventoryState)
                        .filter(([, data]) => data.item.toUpperCase() === code && parseFloat(data.quantity) > 0 && parseFloat(data.quantity) < maxQty)
                        .map(([addr, data]) => ({ address: addr, qty: parseFloat(data.quantity) }))
                        .sort((a, b) => b.qty - a.qty);

                    if (partialPositions.length <= 1) return;

                    // Capture original percentages BEFORE simulation
                    const originalPct = {};
                    partialPositions.forEach(p => {
                        originalPct[p.address] = ((p.qty / maxQty) * 100).toFixed(1);
                    });

                    const sim = partialPositions.map(p => ({ ...p }));
                    const moves = [];
                    let left = 0;
                    let right = sim.length - 1;

                    while (left < right) {
                        const receiver = sim[left];
                        const donor = sim[right];
                        const space = maxQty - receiver.qty;
                        const available = donor.qty;

                        if (space < 0.01) { left++; continue; }
                        if (available < 0.01) { right--; continue; }

                        const transfer = Math.min(space, available);
                        moves.push({
                            from: donor.address,
                            to: receiver.address,
                            qty: Math.round(transfer),
                            fromPct: originalPct[donor.address],
                            toPct: originalPct[receiver.address],
                            spaceInReceiver: Math.round(space)
                        });

                        receiver.qty += transfer;
                        donor.qty -= transfer;

                        if (maxQty - receiver.qty < 0.01) left++;
                        if (donor.qty < 0.01) right--;
                    }

                    // Group flat moves by donor for display (one trip per donor)
                    const tripMap = new Map();
                    moves.forEach(move => {
                        if (!tripMap.has(move.from)) {
                            tripMap.set(move.from, { from: move.from, fromPct: move.fromPct, totalQty: 0, destinations: [] });
                        }
                        const trip = tripMap.get(move.from);
                        trip.totalQty += move.qty;
                        trip.destinations.push({ to: move.to, qty: move.qty, toPct: move.toPct, space: move.spaceInReceiver });
                    });
                    const trips = Array.from(tripMap.values());

                    const freedPositions = sim.filter(p => p.qty < 0.01).length;
                    totalFreedPositions += freedPositions;
                    totalMoves += trips.length;

                    if (trips.length > 0) {
                        allTasks.push({ code, maxQty, trips, freedPositions, partialPositions });
                    }
                });

            async function carregarOcupacaoHistorico() {
                try {
                    const q = query(collection(db, 'ocupacaoHistorico'), orderBy('ts'));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        todosOsDadosHist = snap.docs.map(d => d.data());
                    } else {
                        for (const entry of SEED_OCUPACAO) {
                            const id = entry.ts.replace(/[: ]/g, '-');
                            await setDoc(doc(db, 'ocupacaoHistorico', id), entry);
                        }
                        todosOsDadosHist = [...SEED_OCUPACAO];
                    }
                } catch(e) {
                    console.warn('Histórico de ocupação:', e);
                    todosOsDadosHist = [...SEED_OCUPACAO];
                }
                atualizarVistaHist();
            }

            function getDadosFiltrados() {
                const agora = new Date();
                let dados = [...todosOsDadosHist];

                if (filtroHistInicioAtivo || filtroHistFimAtivo) {
                    dados = dados.filter(d => {
                        const dia = d.ts.substring(0, 10);
                        if (filtroHistInicioAtivo && dia < filtroHistInicioAtivo) return false;
                        if (filtroHistFimAtivo   && dia > filtroHistFimAtivo)   return false;
                        return true;
                    });
                } else if (modoVistaHist === 'diario') {
                    const limite = new Date(agora);
                    limite.setDate(limite.getDate() - 30);
                    const limiteStr = limite.toISOString().substring(0, 10);
                    dados = dados.filter(d => d.ts.substring(0, 10) >= limiteStr);
                } else {
                    const limite = new Date(agora);
                    limite.setFullYear(limite.getFullYear() - 1);
                    const limiteStr = limite.toISOString().substring(0, 7);
                    dados = dados.filter(d => d.ts.substring(0, 7) >= limiteStr);
                }
                return dados;
            }

            function agruparPorMes(dados) {
                const meses = {};
                dados.forEach(d => {
                    const mes = d.ts.substring(0, 7);
                    if (!meses[mes] || d.ocu > meses[mes].ocu) meses[mes] = d;
                });
                return Object.keys(meses).sort().map(m => meses[m]);
            }

            function atualizarVistaHist() {
                const dadosFiltrados = getDadosFiltrados();
                const isMensal = modoVistaHist === 'mensal';
                const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
                const MESES_EXT   = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

                let pontos;
                let labels;

                if (isMensal) {
                    pontos = agruparPorMes(dadosFiltrados);
                    labels = pontos.map(d => {
                        const [y, m] = d.ts.substring(0, 7).split('-');
                        return `${MESES_ABREV[parseInt(m)-1]}/${y.substring(2)}`;
                    });
                } else {
                    pontos = dadosFiltrados;
                    labels = pontos.map(d => {
                        const [date] = d.ts.split(' ');
                        const [y, m, day] = date.split('-');
                        return `${day}/${m}`;
                    });
                }

                const values = pontos.map(d => d.ocu);

                // ── Gráfico ──
                const canvas = document.getElementById('canvasOcupacaoHist');
                if (canvas) {
                    if (graficoOcupacaoHist) graficoOcupacaoHist.destroy();
                    graficoOcupacaoHist = new Chart(canvas.getContext('2d'), {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                label: 'Ocupação (%)',
                                data: values,
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245,158,11,0.08)',
                                fill: true,
                                tension: 0.35,
                                pointRadius: 5,
                                pointHoverRadius: 7,
                                pointBackgroundColor: '#f59e0b',
                                pointBorderColor: '#1f2937',
                                pointBorderWidth: 2,
                                borderWidth: 2.5,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        title: (items) => {
                                            const d = pontos[items[0].dataIndex];
                                            if (isMensal) {
                                                const [y, m] = d.ts.substring(0, 7).split('-');
                                                return `${MESES_EXT[parseInt(m)-1]} ${y} (Pico)`;
                                            }
                                            return d.ts;
                                        },
                                        label: ctx => ` Ocupação: ${ctx.parsed.y.toFixed(1)}%`,
                                        afterLabel: (ctx) => {
                                            const d = pontos[ctx.dataIndex];
                                            return [
                                                `Posições: ${d.pos.toLocaleString('pt-BR')}`,
                                                `Itens: ${d.ite.toLocaleString('pt-BR')}`
                                            ];
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    min: values.length ? Math.max(0, Math.min(...values) - 8) : 0,
                                    max: values.length ? Math.min(100, Math.max(...values) + 8) : 100,
                                    ticks: { callback: v => v + '%', color: '#9ca3af', font: { size: 11 } },
                                    grid: { color: 'rgba(255,255,255,0.05)' }
                                },
                                x: {
                                    ticks: { color: '#9ca3af', font: { size: 11 }, maxRotation: 45 },
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                }

                // ── Tabela ──
                const tbody = document.getElementById('tbodyOcupacaoHist');
                const titulo = document.getElementById('tituloTabelaHist');
                const thData = document.getElementById('thDataHist');

                if (titulo) titulo.textContent = isMensal ? 'Histórico Mensal (Pico de Ocupação)' : 'Histórico de Coletas';
                if (thData) thData.textContent = isMensal ? 'Mês' : 'Data / Hora';

                if (!tbody) return;
                if (!pontos.length) {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-gray-400 text-center">Nenhum dado no período selecionado.</td></tr>`;
                    return;
                }

                const rev = [...pontos].reverse();
                tbody.innerHTML = rev.map((d, i) => {
                    let dateFmt;
                    if (isMensal) {
                        const [y, m] = d.ts.substring(0, 7).split('-');
                        dateFmt = `${MESES_ABREV[parseInt(m)-1]}/${y}`;
                    } else {
                        const [date, time] = d.ts.split(' ');
                        const [y, m, day] = date.split('-');
                        dateFmt = `${day}/${m}/${y} ${time}`;
                    }
                    const badge = d.ocu >= 65
                        ? `<span class="bg-amber-900/40 text-amber-400 px-2 py-0.5 rounded-full text-xs font-bold">${d.ocu.toFixed(1)}% Alto</span>`
                        : d.ocu >= 55
                        ? `<span class="bg-blue-900/40 text-blue-400 px-2 py-0.5 rounded-full text-xs font-bold">${d.ocu.toFixed(1)}% Médio</span>`
                        : `<span class="bg-green-900/40 text-green-400 px-2 py-0.5 rounded-full text-xs font-bold">${d.ocu.toFixed(1)}% Baixo</span>`;
                    const rowCls = i === 0 ? 'border-b border-gray-700 bg-amber-900/10' : 'border-b border-gray-700';
                    return `<tr class="${rowCls}">
                        <td class="py-2 pr-4 text-gray-300">${dateFmt}${i===0?' <span class="text-amber-400 text-xs">●</span>':''}</td>
                        <td class="py-2 pr-4">${badge}</td>
                        <td class="py-2 pr-4 text-gray-300">${d.pos.toLocaleString('pt-BR')}</td>
                        <td class="py-2 text-gray-300">${d.ite.toLocaleString('pt-BR')}</td>
                    </tr>`;
                }).join('');
            }

            async function registrarColetaAtual() {
                if (!currentDashboardStats) return;
                const { ocu, pos, ite } = currentDashboardStats;
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const ts = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
                try {
                    await setDoc(doc(db, 'ocupacaoHistorico', ts.replace(/[: ]/g, '-')), { ts, ocu, pos, ite });
                    await carregarOcupacaoHistorico();

            function createRackGridElement(rackNumber, sourceInventory = inventoryState) {
                const cols = WAREHOUSE_CONFIG.getColsForRack(rackNumber);
                const CELL = 72;
                const GAP  = 6;
                const LABEL = 28;

                // Outer wrapper
                const wrapper = document.createElement('div');
                wrapper.style.display = 'inline-block';

                // ── Column numbers header ──
                const colHeader = document.createElement('div');
                colHeader.style.cssText = `display:flex;gap:${GAP}px;margin-left:${LABEL + GAP}px;margin-bottom:4px;`;
                for (let col = 1; col <= cols; col++) {
                    const n = document.createElement('div');
                    n.style.cssText = `width:${CELL}px;text-align:center;font-size:10px;color:#4b5563;flex-shrink:0;`;
                    n.textContent = String(col).padStart(2, '0');
                    colHeader.appendChild(n);
                }
                wrapper.appendChild(colHeader);

                // ── Body: level labels + cell grid ──
                const body = document.createElement('div');
                body.style.cssText = `display:flex;gap:${GAP}px;`;

                // Level label column (F → A, top to bottom)
                const labelCol = document.createElement('div');
                labelCol.style.cssText = `display:flex;flex-direction:column;gap:${GAP}px;width:${LABEL}px;flex-shrink:0;`;
                WAREHOUSE_CONFIG.levelLetters.forEach(letter => {
                    const lbl = document.createElement('div');
                    lbl.style.cssText = `height:${CELL}px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#6b7280;`;
                    lbl.textContent = letter;
                    labelCol.appendChild(lbl);
                });
                body.appendChild(labelCol);

                // Cell grid
                const grid = document.createElement('div');
                grid.className = 'grid gap-1.5';
                grid.style.gridTemplateColumns = `repeat(${cols}, ${CELL}px)`;

                WAREHOUSE_CONFIG.levelLetters.forEach(levelLetter => {
                    for (let col = 1; col <= cols; col++) {
                        const positionContainer = document.createElement('div');
                        positionContainer.className = 'flex aspect-square rounded-sm overflow-hidden';
                        const levelNum = WAREHOUSE_CONFIG.levelMap[levelLetter];

                        WAREHOUSE_CONFIG.sides.forEach((side, index) => {
                            const cell = document.createElement('div');
                            const address = `PP${String(rackNumber).padStart(2, '0')}.${String(col).padStart(2, '0')}.${levelNum}.${side}`;
                            cell.dataset.address = address;

                            let cellClasses = 'pallet-cell w-1/2 h-full bg-gray-700 cursor-pointer flex items-center justify-center';
                            if (index === 0) cellClasses += ' border-r border-black';
                            cell.className = cellClasses;

                            const data = sourceInventory[address];
                            if (data) {
                                cell.title = `${address}\nProduto: ${data.item}\nQtd: ${data.quantity}`;
                                if (data.percentage !== undefined && !isNaN(data.percentage)) {
                                    if (data.percentage > 100) {
                                        cell.classList.add('over-capacity');
                                    } else if (data.percentage < 99.9) {
                                        cell.classList.add('partial-fill');
                                    } else {
                                        cell.classList.add('filled');
                                    }
                                    cell.innerHTML = `<span class="text-xs font-bold pointer-events-none">${Math.round(data.percentage)}%</span>`;
                                } else {
                                    cell.classList.add('filled');
                                }
                            } else {
                                cell.title = address;
                            }

                            cell.addEventListener('click', () => handleCellClick(cell, sourceInventory));
                            cell.addEventListener('dblclick', () => {
                                if (sourceInventory === inventoryState) {
                                    handleCellToggle(cell, rackNumber);
                                }
                            });
                            positionContainer.appendChild(cell);
                        });
                        grid.appendChild(positionContainer);
                    }
                });

                body.appendChild(grid);
                wrapper.appendChild(body);
                return wrapper;
            }
            
            function updateRackStats(rackNumber, sourceInventory = inventoryState) {
                const statsContainer = document.getElementById(`stats-rack-${rackNumber}`);
                if (!statsContainer) return;

                const cols = WAREHOUSE_CONFIG.getColsForRack(rackNumber);
                const totalPositions = cols * WAREHOUSE_CONFIG.levelLetters.length * WAREHOUSE_CONFIG.sides.length;
                
                let filledCount = 0;
                const rackPrefix = `PP${String(rackNumber).padStart(2, '0')}`;
                Object.keys(sourceInventory).forEach(address => {
                    if (address.startsWith(rackPrefix)) {
                        filledCount++;
                    }
                });

                const emptyCount = totalPositions - filledCount;
                const percentage = totalPositions > 0 ? ((filledCount / totalPositions) * 100).toFixed(1) : 0;

                statsContainer.innerHTML = `
                    <span class="text-sm font-normal text-gray-400">
                        ${cols} Colunas | Posições: 
                        <span class="font-semibold text-white">${totalPositions}</span> Total | 
                        <span class="font-semibold text-green-400">${emptyCount}</span> Vazias | 
                        <span class="font-semibold text-red-400">${filledCount}</span> Preenchidas |
                        <span class="font-bold text-amber-400">${percentage}% Ocupado</span>
                    </span>
                `;
            }

            function displayImportScreen() {
                mainContent.innerHTML = `
                    <div class="max-w-2xl mx-auto">
                        <h2 class="text-2xl font-bold mb-4 text-amber-400">Importar Relatório de Estoque</h2>
                        <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                            <p class="text-gray-300 mb-4">Cole o conteúdo do seu relatório na área abaixo ou carregue um arquivo (.txt, .csv).</p>
                            <p class="text-sm text-gray-400 mb-4">O formato esperado é: <code class="bg-gray-900 px-2 py-1 rounded">POSIÇÃO,Itens,Quantidade</code> por linha. O separador pode ser vírgula, ponto e vírgula ou tabulação.</p>
                            
                            <textarea id="import-textarea" class="uppercase-input w-full h-48 bg-gray-700 text-gray-300 p-3 rounded-md border border-gray-600 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" placeholder="Ex: PP01.01.01.A,PRODUTO EXEMPLO,100&#10;PP01.01.01.B,PRODUTO Y,50&#10;PP01.01.02.A,PRODUTO Z,200&#10;PP01.01.02.B,; (Para esvaziar esta posição)"></textarea>

                            <div class="mt-4 flex items-center justify-between">
                                <label for="file-upload" class="cursor-pointer px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-md font-semibold transition-colors duration-150">
                                    Carregar Arquivo
                                </label>
                                <input id="file-upload" type="file" class="hidden" accept=".csv,.txt">
                                <button id="import-button" class="px-6 py-2 bg-green-600 hover:bg-green-500 rounded-md font-semibold transition-colors duration-150">Importar Dados</button>
                            </div>
                           <p id="import-status" class="text-center mt-4 h-6"></p>
                        </div>
                    </div>
                `;

                const fileUpload = document.getElementById('file-upload');
                const textarea = document.getElementById('import-textarea');
                
                fileUpload.addEventListener('change', (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            textarea.value = e.target.result;
                        };
                        reader.readAsText(file);
                    }
                });

                document.getElementById('import-button').addEventListener('click', () => {
                    const data = textarea.value;
                    if (!data.trim()) {
                        document.getElementById('import-status').textContent = 'Nenhum dado para importar.';
                        return;
                    }

                    const lines = data.split(/\r?\n/);
                    let updatedCount = 0;
                    let errorCount = 0;
                    const positionRegex = /^PP(\d{2})\.(\d{2})\.(\d{2})\.([AB])$/i;

                    lines.forEach(line => {
                        if (!line.trim()) return;
                        if (line.toLowerCase().includes('posição')) return;

                        const parts = line.split(/[,;\t]/);
                        if (parts.length >= 3) {
                            const position = parts[0].trim().toUpperCase();
                            const item = parts[1].trim().toUpperCase();
                            const quantity = parts[2].trim();

                            const match = position.match(positionRegex);

                            if (match) {
                                const rackNumber = parseInt(match[1], 10);
                                const col = parseInt(match[2], 10);
                                const levelNum = match[3];

                                const maxColsForRack = WAREHOUSE_CONFIG.getColsForRack(rackNumber);
                                const validLevelNums = Object.values(WAREHOUSE_CONFIG.levelMap);

                                // Validação rigorosa da posição
                                if (rackNumber > 0 && rackNumber <= WAREHOUSE_CONFIG.totalRacks && col > 0 && col <= maxColsForRack && validLevelNums.includes(levelNum)) {
                                    if (item === '' && quantity === '') {
                                        delete inventoryState[position];
                                    } else {
                                        const productParam = PRODUCT_PARAMS_DATA.find(p => p.code.toUpperCase() === item.toUpperCase());
                                        const maxQty = productParam ? parseFloat(productParam.maxQty) : 0;
                                        let percentage = 100; // Default to 100% if no param is found
                                        if(maxQty > 0) {
                                            percentage = (parseFloat(quantity) / maxQty) * 100;
                                        }
                                        inventoryState[position] = { item, quantity, percentage };
                                    }
                                    updatedCount++;
                                } else {
                                    // Posição inválida (ex: coluna 20 em um rack de 16)
                                    errorCount++;
                                }
                            } else {
                                // Formato da posição não corresponde ao regex
                                errorCount++;
                            }
                        } else if (line.trim()) {
                             errorCount++;
                        }
                    });

                    saveData();
                    const statusEl = document.getElementById('import-status');
                    statusEl.textContent = `Importação concluída! ${updatedCount} posições atualizadas. ${errorCount} linhas com erro. Atualizando o mapa...`;
                    statusEl.classList.add('text-green-400');
                    
                    setTimeout(() => {
                        const allLink = document.querySelector('a[data-rack="all"]');
                        if (allLink) allLink.click();
                    }, 2500);

            function processUploadedFile(file, callback) {
                const reader = new FileReader();
                const extension = file.name.split('.').pop().toLowerCase();

                if (extension === 'xlsx' || extension === 'xls') {
                    reader.onload = (e) => {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true, dateNF:'dd/mm/yyyy' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, dateNF:'dd/mm/yyyy' });
                        callback(json);
                    };
                    reader.readAsArrayBuffer(file);
                } else { // csv, txt
                    reader.onload = (e) => {
                        const text = e.target.result;
                        const lines = text.split(/\r?\n/).filter(line => line.trim());
                        const dataAsArrays = lines.map(line => line.split(/[,;\t]/));
                        callback(dataAsArrays);
                    };
                    reader.readAsText(file);
                }
            }

                    const file = event.target.files[0];
                    if (!file) return;
                    
                    statusEl.textContent = 'Processando arquivo...';
                    processUploadedFile(file, (data) => {
                         try {
                            if (data.length < 2) throw new Error("Arquivo inválido ou vazio.");

                            const newForecast = {};
                            const header = data[0];
                            const dates = header.slice(1).map(dateCell => {
                                let dateStr = String(dateCell).trim();
                                if (typeof dateCell === 'number') { // Excel date number
                                    const jsDate = XLSX.SSF.parse_date_code(dateCell);
                                    return `${jsDate.y}-${String(jsDate.m).padStart(2, '0')}-${String(jsDate.d).padStart(2, '0')}`;
                                }
                                if (dateStr.includes('/')) {
                                    const parts = dateStr.split('/');
                                    if(parts.length === 3) {
                                        const [day, month, year] = parts.map(p => p.trim());
                                        const fullYear = year.length === 2 ? '20' + year : year;
                                        return `${fullYear}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                    }
                                }
                                return dateStr; // Assume YYYY-MM-DD
                            });
                            
                            for (let i = 1; i < data.length; i++) {
                                const row = data[i];
                                const productCode = String(row[0]).trim().toUpperCase();
                                if (!productCode) continue;

                                for (let j = 1; j < row.length; j++) {
                                    const date = dates[j - 1];
                                    const quantity = parseFloat(row[j]);

                                    if (date && !isNaN(quantity) && quantity > 0) {
                                        if (!newForecast[date]) newForecast[date] = {};
                                        newForecast[date][productCode] = quantity;
                                    }
                                }

                            FORECAST_DATA = newForecast; 
                            nextRenderMessage = `Arquivo carregado! ${Object.keys(newForecast).length} dias, ${data.length - 1} produtos. Clique em 'Salvar'.`;
                            refreshCurrentView();

                        } catch (error) {
                            console.error("Erro ao processar o arquivo de forecast:", error);
                            nextRenderMessage = 'Erro ao processar. Verifique o formato do arquivo.';
                            refreshCurrentView();
                        } finally {

                    });
                });

                        deleteAllButton.classList.add('bg-yellow-500', 'hover:bg-yellow-400', 'text-black');
                        setTimeout(() => {

                    allDates.add(date);
                    for(const productCode in forecastData[date]){

                            productForecasts[productCode] = {};

                    const dateObj = new Date(date + 'T00:00:00');
                    const formattedDate = isNaN(dateObj) ? 'Data Inválida' : dateObj.toLocaleDateString('pt-BR');
                    tableHTML += `<th class="p
